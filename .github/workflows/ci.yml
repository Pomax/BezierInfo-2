name: CI-CD

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/fonts'
      - 'docs/images'
      - 'docs/ja-JP'
      - 'docs/uk-UA'
      - 'docs/zn-CH'
      - 'docs/*.{html,php,md,css}'
      - 'docs/news/*.html'
      - 'temp'
      - 'README.md'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/fonts'
      - 'docs/images'
      - 'docs/ja-JP'
      - 'docs/uk-UA'
      - 'docs/zn-CH'
      - 'docs/*.{html,php,md,css}'
      - 'docs/news/*.html'
      - 'temp'
      - 'README.md'

jobs:
  build:
    name: Building the Primer website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installing TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install xzdec libpoppler-glib-dev texlive texlive-xetex texlive-fonts-extra texlive-extra-utils -y

      - name: Installing pdf2svg
        run: bash .github/workflows/pdf2svg.sh

      - name: Installing latest Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Installing node-canvas build dependencies
        run: |
          sudo apt-get install build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Installing dependencies
        run: |
          npm install
          echo "finished installing dependencies"

      - name: Running npm build
        run: |
          echo "running build..."
          npm run deploy:ci

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          echo "forming commit..."
          git status
          git config --local user.email "action@github.com"
          git config --local user.name "Bezierinfo CI"
          set +e
          git add -A
          git commit -m "Automated build"
          set -e
          git push --force origin master
